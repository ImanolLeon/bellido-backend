info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/auth/login
  body:
    type: json
    data: |-
      {
        "dni": "61230112",
        "password": "123456"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status == 200) {
          bru.setVar("token", res.body.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
